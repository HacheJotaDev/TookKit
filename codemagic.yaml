workflows:
  android-apk:
    name: HJTools X - Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17

      env:
        NEXT_PUBLIC_API_URL: "https://hjtools-x.vercel.app"

      vars:
        PACKAGE_NAME: "com.hjtoolsx.app"

      # Android signing configuration
      # Upload your keystore in Codemagic UI: Settings > Environment variables > Keystore
      # Or set these as environment variables in Codemagic:
      # KEYSTORE_BASE64 - base64 encoded keystore file
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD

      android_signing:
        - keystore_reference: KEYSTORE_BASE64
          keystore_path: /tmp/keystore.jks

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Decode keystore
        script: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
            export KEYSTORE_PATH=/tmp/keystore.jks
          fi

      - name: Install Node.js dependencies
        script: |
          npm ci

      - name: Generate Prisma client
        script: |
          npx prisma generate

      - name: Build Next.js static export
        script: |
          # Temporarily move API routes for static export
          mv src/app/api src/app/_api
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL npx next build
          mv src/app/_api src/app/api

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Set Android SDK permissions
        script: |
          chmod +x android/gradlew

      - name: Build Android APK (debug)
        script: |
          cd android
          ./gradlew assembleDebug
        artifact_pattern: "android/app/build/outputs/**/*.apk"

      - name: Build Android APK (release)
        script: |
          if [ -f /tmp/keystore.jks ]; then
            cd android
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          else
            echo "No keystore found - building debug APK instead"
            cd android
            ./gradlew assembleDebug
          fi
        artifact_pattern: "android/app/build/outputs/**/*.apk"

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - hachejota.dev@gmail.com
        notify:
          success: true
          failure: true
