workflows:
  android-apk:
    name: HJTools X - Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17

      env:
        NEXT_PUBLIC_API_URL: "https://hjtoolsx.vercel.app"

      vars:
        PACKAGE_NAME: "com.hjtoolsx.app"

      android_signing:
        - keystore_reference: KEYSTORE_BASE64
          keystore_path: /tmp/keystore.jks

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate Prisma client
        script: |
          npx prisma generate

      - name: Build Next.js
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
