workflows:
  android-apk:
    name: HJTools X APK

    max_build_duration: 30

    environment:
      node: 20
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate Prisma client
        script: |
          npx prisma generate

      - name: Build Next.js
        script: |
          mv src/app/api src/app/api_backup
          NEXT_PUBLIC_API_URL=https://hjtoolsx.vercel.app npm run build
          mv src/app/api_backup src/app/api

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
